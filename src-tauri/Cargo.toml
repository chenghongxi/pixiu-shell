[package]
name = "pixiu-shell"
version = "0.9.28"
edition = "2024"
description = "Pixiu Shell operations terminal"
publish = false

[lib]
name = "pixiu_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
portable-pty = "0.9"
url = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ssh2 = "0.9"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "rand_core", "getrandom", "encryption"] }
rfd = "0.15"
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"

tempfile = "3"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
calamine = "0.37.0"
serde_yaml = "0.9.34"
rust_xlsxwriter = "0.101.0"

# The Windows WinCNG backend in libssh2 does not implement Ed25519 and leaves
# ECDSA disabled. Link libssh2 to a statically built OpenSSL instead, so the
# released application supports the same modern private-key algorithms without
# requiring an OpenSSL installation on the user's machine.
[target.'cfg(windows)'.dependencies]
ssh2 = { version = "0.9", features = ["openssl-on-win32", "vendored-openssl"] }
